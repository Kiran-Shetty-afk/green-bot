name: Green Bot

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at 12:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update and commit randomly
        run: |
          git config --global user.name "Kiran Green Bot"
          git config --global user.email "kiranshetty2004@gmail.com"
          
          NUM_COMMITS=$(( ( RANDOM % 10 ) + 1 ))
          echo "Making $NUM_COMMITS commits today"
          
          for i in $(seq 1 $NUM_COMMITS); do
            echo "Last updated: $(date) - commit $i" > data.md
            git add data.md
            git commit -m "Daily update $i"
          done
          
          git push
